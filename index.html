.generator-cell.locked .source-art{filter:grayscale(1);opacity:.6}

.generator-cell:not(.locked){animation:producer-breathe 3s ease-in-out infinite}
@keyframes producer-breathe{50%{filter:brightness(1.07)}}
.info-dock{margin-top:2px;min-height:58px;max-height:64px;padding:6px 7px;border-radius:13px}
.info-icon{width:40px;height:40px;border-radius:11px}.info-copy strong{font-size:11px}.info-copy small{font-size:9px;line-height:1.2}
.mini{padding:7px 8px;font-size:10px;border-radius:10px}

.nav{padding:5px 8px calc(4px + var(--safe-bottom));gap:5px}
.nav button{padding:4px 3px 3px;font-size:10px;border-radius:12px;gap:1px}
.nav .ico{font-size:16px}
/* overlays, rewards, lively screens */
.board-shell{background:linear-gradient(160deg,#f6c77c,#e7a55a 70%,#c87c47)}
.board-panel{background:repeating-linear-gradient(0deg,#fdf2d9 0px,#fdf2d9 43px,#f8e7c9 44px,#f8e7c9 87px)}
.cell.empty:nth-child(even){background:rgba(255,245,226,.25)}
.cell.just-spawned .piece{animation:spawn-pop .45s cubic-bezier(.1,1.7,.3,1) both}
.cell.merged-flash .piece{animation:merge-zoom .56s cubic-bezier(.2,1.7,.2,1)}
@keyframes spawn-pop{0%{opacity:0;transform:scale(.25) rotate(-18deg)}70%{transform:scale(1.2) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes merge-zoom{0%{transform:scale(.45);filter:brightness(2)}45%{transform:scale(1.27);filter:brightness(1.3)}100%{transform:scale(1)}}
.burst{position:fixed;z-index:1500;pointer-events:none;font-size:19px;font-weight:900;transform:translate(-50%,-50%);text-shadow:0 0 5px #fff;animation:burst-fly .85s ease-out forwards}

.mhead{background:linear-gradient(180deg,#79d5ed,#1da9d8);box-shadow:inset 0 -4px #118bb7;position:relative;border-bottom:3px solid #fff0e0}

function renderTop(){ syncTime(); $('soundBtn').textContent=S.sound?'🔊':'🔇'; $('energyText').textContent=`${S.energy} / ${MAX_ENERGY}`; $('energyTimer').textContent=S.energy>=MAX_ENERGY?'충전 완료':`+1 ${timerString(S.nextEnergyAt-Date.now())}`; $('coinText').textContent=fmt(S.coins); $('rubyText').textContent=fmt(S.rubies); $('starText').textContent=fmt(S.stars); $('deliveryText').textContent=`납품 ${S.deliveries}회`;  const story=[...STORIES].reverse().find(storyUnlocked)||STORIES[0]; $('storySummary').textContent=story.title; $('mergeStoryTitle').textContent=story.title; $('mergeStoryCopy').textContent=story.lines[0][1]; if(!$('storyPortrait').firstChild)$('storyPortrait').innerHTML=portraitArt(CUSTOMERS[0]); if(!$('heroBadge').querySelector('img'))$('heroBadge').innerHTML=portraitArt(CUSTOMERS[0])+'<span class="lv" id="levelBadge">'+levelOf()+'</span>'; else $('levelBadge').textContent=levelOf(); }
function renderNav(){ $('bottomNav').innerHTML=TABS.map(t=>`<button class="${S.tab===t.id?'active':''}" data-tab="${t.id}"><span class="ico">${t.icon}</span><span>${t.label}</span></button>`).join(''); }
function renderPages(){ document.querySelectorAll('.page').forEach(p=>{ p.classList.toggle('active', p.id===`page-${S.tab}`); }); }
function renderOrders(){ $('orderRail').innerHTML=S.orders.map((o,i)=>{ const c=customer(o.client), ready=orderReady(o); const hits=findInventoryMatches(o); const wants=o.needs.map((n,k)=>`<div class="want ${hits[k]>=0?'ok':''}"><div class="piece ${getChain(n.chain).klass}"><span class="art">${itemArt(n.chain,n.lvl)}</span></div>${hits[k]>=0?'<span class="n">✓</span>':''}</div>`).join(''); return `<div class="order-card ${ready?'ready':''}"><div class="person-row"><div class="portrait">${portraitArt(c)}</div><div class="pmeta"><strong>${esc(c.name)}</strong><small>${esc(c.role)}</small></div></div><div class="want-list">${wants}</div><div class="order-reward">🪙${o.reward.coin} · ⭐${o.reward.star}${o.reward.ruby?` · 💎${o.reward.ruby}`:''}</div><button class="go" data-order="${i}" ${ready?'':'disabled'}>${ready?'주문 완료하기':'아이템 준비 중'}</button></div>`; }).join(''); }
function fitBoard(){
 const panel=document.querySelector('.board-panel'),board=$('board');if(!panel||!board)return;
 // Use all available width/height, with square cells like the reference game's grid.
 const bounds=panel.getBoundingClientRect();
 const w=Math.max(140,bounds.width-10),h=Math.max(180,bounds.height-10),gap=3;
 const side=Math.max(12,Math.min((w-gap*6)/7,(h-gap*8)/9));
 board.style.width=Math.round(side*7+gap*6)+'px';
 board.style.height=Math.round(side*9+gap*8)+'px';
}
function renderBoard(){
 const need=demandKeys(); let used=0;
 $('board').innerHTML=S.board.map((item,i)=>{
   if(Object.prototype.hasOwnProperty.call(SOURCE_INDEXES,i)){
     const gen=GENERATORS[SOURCE_INDEXES[i]], locked=S.stars<gen.unlockStars;
     return `<button class="cell generator-cell ${locked?'locked':''}" data-source="${gen.id}" aria-label="${gen.name} 생성기" title="${gen.name}: ⚡${gen.cost}"><span class="producer ${getChain(gen.chain).klass}"><span class="source-art">${generatorArt(gen.chain)}</span><span class="source-bolt">${locked?'🔒':'⚡'}</span></span><span class="source-caption">${getChain(gen.chain).name.replace('겨울 ','').replace('선물 ','')}</span></button>`;
   }
   const cls=['cell']; if(!item)cls.push('empty');if(S.selected===i)cls.push('selected');
   if(item&&need[item.chain+':'+item.lvl])cls.push('need');
   if(item)used++;
   const inside=item?`<div class="piece ${getChain(item.chain).klass}"><span class="art">${itemArt(item.chain,item.lvl)}</span></div>`:'';
   return `<button class="${cls.join(' ')}" data-cell="${i}" aria-label="${item?itemName(item):'빈 칸'}">${inside}</button>`;
 }).join('');
 $('boardMeta').textContent=`${used} / ${GRID-5}칸 · 생성기 5종`;
 renderInfo(); fitBoard();
}
function renderInfo(){ const item=S.board[S.selected]; if(!item){ $('infoDock').innerHTML=`<div class="info-icon">👆</div><div class="info-copy"><strong>아이템을 선택해 보세요</strong><small>같은 아이템끼리 머지하면 한 단계 올라가고, 손님 주문에 필요한 아이템은 초록빛으로 표시돼요.</small></div><div class="info-actions"><button class="mini" id="tipsBtn">설명</button></div>`; $('tipsBtn').onclick=openHelp; return; } const lv=getLevel(item.chain,item.lvl); $('infoDock').innerHTML=`<div class="info-icon"><div class="piece ${getChain(item.chain).klass}" style="width:40px;height:40px;border-radius:14px"><span class="art">${itemArt(item.chain,item.lvl)}</span></div></div><div class="info-copy"><strong>${lv.name} · ${item.lvl+1}단계</strong><small>${lv.desc} · ${getChain(item.chain).name}</small></div><div class="info-actions"><button class="mini" id="sellBtn">판매</button><button class="mini info-alert" id="bookBtn" aria-label="머지 족보 열기">!</button></div>`; $('sellBtn').onclick=sellSelected; $('bookBtn').onclick=()=>openChainModal(item.chain); }
function renderGenerators(){ $('genRow').innerHTML=GENERATORS.map(g=>{ const locked=S.stars<g.unlockStars; return `<button class="gen ${locked?'locked':''}" data-gen="${g.id}"><div class="gtop"><div class="gico">${generatorIcon(g.chain)}</div><div><strong>${g.name}</strong><small>${getChain(g.chain).name}</small></div></div><div class="gfoot"><span class="tag">${locked?`⭐ ${g.unlockStars}`:'생성 가능'}</span><span>⚡ ${g.cost}</span></div></button>`; }).join(''); }
function renderVillage(){ const page=$('page-village'); page.innerHTML=`<div class="panel"><div class="panel-top"><h3>눈꽃 마을</h3><div class="sub">별로 해금 · 코인으로 구매 · 탭해서 이동</div></div><div class="village-hero"><div class="village-backdrop">${villageScene()}</div><div class="sky-status"><div class="cloud">☁️ ❄️ ☁️</div><div class="badge">수입 +${incomePerMinute()} / 1분 · 배치 ${S.placed.length}개</div></div><div class="plots" id="plotGrid"></div></div><div class="vShop" id="vShop"></div></div>`;
  const slots=Array.from({length:15},(_,i)=>i); $('plotGrid').innerHTML=slots.map(slot=>{ const placed=S.placed.find(p=>p.slot===slot); if(!placed){ return `<button class="plot empty ${S.pendingPlace||S.selectedVillageMove!==null?'sel':''}" data-plot="${slot}">${S.pendingPlace?'＋':'·'}</button>`; } const def=VILLAGE_SHOP.find(v=>v.id===placed.shopId)||VILLAGE_SHOP[0]; return `<button class="plot ${S.selectedVillageMove===slot?'sel':''}" data-plot="${slot}">${villageArt(def.id)}<span class="label">${def.name}</span></button>`; }).join('');
  $('vShop').innerHTML=VILLAGE_SHOP.map(shop=>{ const locked=S.stars<shop.unlockStars; const owned=S.placed.filter(p=>p.shopId===shop.id).length; return `<div class="buy-card"><div class="t"><div class="bico">${villageArt(shop.id)}</div><div><strong>${shop.name}</strong><small>${shop.desc}</small></div></div><button class="buy ${locked?'locked':''}" data-buy="${shop.id}">${locked?`⭐ ${shop.unlockStars} 필요`:owned?`배치 ${owned}개 · 구매`: `구매 🪙${shop.price}`}</button></div>`; }).join(''); }
function renderStyle(){ const page=$('page-style'); page.innerHTML=`<div class="panel style-stage"><div class="panel-top"><h3>주인공 꾸미기</h3><div class="sub">별과 미션 보상으로 해금</div></div><div class="doll-stage"><div class="doll-portrait">${portraitArt(CUSTOMERS[0])}</div><div class="avatarBox">${protagonistArt()}</div></div><div id="styleWrap"></div></div>`; $('styleWrap').innerHTML=STYLE_GROUPS.map(group=>`<div class="styleGroup"><h4>${group.title}</h4><div class="styleGrid">${group.items.map(it=>{ const unlocked=styleUnlocked(group.key,it), active=S.avatar[group.key]===it.id; const label=group.key==='hair'?'💇🏻':group.key==='outfit'?'👗':'✨'; return `<button class="styleOpt ${unlocked?'':'locked'} ${active?'active':''}" data-stylegroup="${group.key}" data-style="${it.id}"><div class="pv">${label}</div><strong>${it.name}</strong><small>${unlocked?'사용 가능':it.unlockMission?'미션 보상':`⭐ ${it.unlockStars}`}</small></button>`; }).join('')}</div></div>`).join(''); }
function renderBook(){ const page=$('page-book'); page.innerHTML=`<div class="panel"><div class="panel-top"><h3>머지 도감</h3><div class="sub">미발견 항목은 ? 로 표시</div></div><div id="bookWrap"></div></div>`; $('bookWrap').innerHTML=Object.values(CHAINS).map(chain=>`<div class="bookGroup"><div class="panel-top"><h3 style="font-size:14px;margin:0">${chain.name}</h3><button class="mini info-alert" data-chaininfo="${chain.id}" aria-label="머지 족보 열기">!</button></div><div class="bookRow">${chain.levels.map((lv,i)=>{ const known=S.discovered[chain.id][i]; return `<div class="bookItem"><div class="ic ${known?'':'q'}">${known?itemArt(chain.id,i):'?'}</div><strong>${known?lv.name:'미발견'}</strong><small>${known?`${i+1}단계`:'?'}</small></div>`; }).join('')}</div></div>`).join(''); }
function renderMissions(){ const page=$('page-missions'); page.innerHTML=`<div class="panel"><div class="panel-top"><h3>이벤트 · 미션 · 업적</h3><div class="sub">완료 후 보상 수령</div></div><div class="missionTabs" id="missionTabs"></div><div class="mList" id="missionList"></div></div>`; $('missionTabs').innerHTML=[['daily','일일 미션'],['event','이벤트'],['achievement','업적']].map(([id,label])=>`<button class="${missionView===id?'active':''}" data-mtab="${id}">${label}</button>`).join(''); $('missionList').innerHTML=MISSIONS[missionView].map(m=>{ const prog=missionProgress(m), pct=Math.min(100,prog.value/prog.target*100), claimed=isMissionClaimed(m.id); const rewardTxt=[m.reward.coin?`🪙${m.reward.coin}`:'',m.reward.star?`⭐${m.reward.star}`:'',m.reward.ruby?`💎${m.reward.ruby}`:'',m.reward.energy?`⚡${m.reward.energy}`:'',m.reward.styleUnlock?'👗 스타일':''].filter(Boolean).join(' · '); return `<div class="mission"><div class="hd"><strong>${m.title}</strong><span>${Math.min(prog.value,m.target)} / ${m.target}</span></div><p>${m.desc}</p><div class="bar"><span style="width:${pct}%"></span></div><div class="ft"><div class="reward">보상 ${rewardTxt}</div><button class="claim ${!claimed&&prog.value>=m.target?'ready':''}" data-claim="${m.id}" ${claimed?'disabled':''}>${claimed?'수령 완료':prog.value>=m.target?'보상 받기':'진행 중'}</button></div></div>`; }).join(''); }
function renderSidePages(){ renderVillage(); renderStyle(); renderBook(); renderMissions(); }
function renderAll(){ renderTop(); renderNav(); renderOrders(); renderBoard(); renderGenerators(); renderPages(); if(S.tab!=='merge')renderSidePages(); }
function render(){ fillOrders(); renderAll(); }

function openModal(title, body, alt=false){ $('modalBox').innerHTML=`<div class="mhead ${alt?'alt':''}"><strong>${title}</strong><button class="close" id="closeModal">✕</button></div><div class="mbody">${body}</div>`; $('modalBg').classList.add('show'); document.body.style.overflow='hidden'; $('closeModal').onclick=closeModal; }
function closeModal(){ $('modalBg').classList.remove('show'); document.body.style.overflow=''; }
function openChainModal(chainId){ const chain=getChain(chainId); openModal(chain.name, `<div class="bubble"><strong>${chain.name} 족보</strong><p>같은 아이템 2개를 머지하면 다음 단계로 올라갑니다. 미발견 단계는 ? 로 가려집니다.</p></div><div style="height:12px"></div><div class="chainGrid">${chain.levels.map((lv,i)=>{ const known=S.discovered[chain.id][i]; return `<div class="chainCell"><div class="x">${known?itemArt(chain.id,i):'?'}</div><strong>${known?lv.name:'미발견'}</strong><small>${i+1}단계</small></div>`; }).join('')}</div>`); }
function openStoryModal(){ const unlocked=STORIES.filter(storyUnlocked); const latest=unlocked[unlocked.length-1]||STORIES[0]; openModal(latest.title, `<div class="dialogue">${latest.lines.map(([who,line])=>`<div class="bubble"><strong>${who}</strong><p>${line}</p></div>`).join('')}</div>`, true); }
function openEventModal(){
 const m=MISSIONS.event[0], done=isMissionClaimed(m.id),n=Math.min(S.deliveries,m.target);
 const pct=Math.min(100,n/m.target*100);
 const body=`<div class="event-hero"><div class="event-santa">🎅</div><div><strong>산타의 특별한 부탁!</strong><p>눈꽃 마을 손님들의 주문을 도와 축제를 준비해요.</p></div></div>
 <div class="bubble"><strong>주문 납품 ${n} / ${m.target}</strong><div class="bar" style="margin:12px 0 8px"><span style="width:${pct}%"></span></div><p>${done?'보상을 모두 받았어요!':'주문을 마치면 특별 산타 의상과 루비 5개를 받을 수 있어요.'}</p></div>
 <div class="event-prizes"><span>🎁 산타 룩</span><span>💎 루비 5개</span><span>⭐ 축제 이야기</span></div>
 <button class="event-go" id="eventGo">이벤트 미션 보러 가기</button>`;
 openModal('🎄 산타 도와주기',body,true);
 $('eventGo').onclick=()=>{closeModal();missionView='event';setTab('missions');};
}
function openHelp(){ openModal('플레이 방법', `<div class="dialogue"><div class="bubble"><strong>1. 생성기 사용</strong><p>선물상자, 다과 바구니, 포토 스튜디오 등 여러 생성기를 눌러 라인별 아이템을 만드세요.</p></div><div class="bubble"><strong>2. 머지하기</strong><p>같은 아이템을 드래그하거나, 먼저 선택한 뒤 다른 칸을 눌러 합칠 수 있어요.</p></div><div class="bubble"><strong>3. 손님 주문 납품</strong><p>손님 카드를 보면 필요한 아이템이 표시됩니다. 완료하면 코인, 별, 경험치를 얻어요.</p></div><div class="bubble"><strong>4. 마을/주인공 꾸미기</strong><p>별과 미션 보상으로 새로운 생성기, 건물, 의상, 소품이 열립니다.</p></div></div>`); }

function buyPlace(id){ const shop=VILLAGE_SHOP.find(v=>v.id===id); if(S.stars<shop.unlockStars){ toast(`⭐ ${shop.unlockStars}개 이상 모으면 열려요.`); return; } if(S.coins<shop.price){ toast('코인이 부족해요.'); return; } S.pendingPlace=id; S.selectedVillageMove=null; renderVillage(); toast(`${shop.name}을(를) 둘 빈 부지를 눌러 주세요.`); }
function placeAt(slot){ if(S.pendingPlace){ if(S.placed.some(p=>p.slot===slot)){ toast('이미 배치된 자리예요.'); return; } const shop=VILLAGE_SHOP.find(v=>v.id===S.pendingPlace); S.coins-=shop.price; S.placed.push({shopId:shop.id,slot}); S.pendingPlace=null; save(); renderVillage(); renderTop(); toast(shop.name+' 배치 완료!'); return; }
  if(S.selectedVillageMove!==null && !S.placed.some(p=>p.slot===slot)){ const idx=S.placed.findIndex(p=>p.slot===S.selectedVillageMove); if(idx>=0){ S.placed[idx].slot=slot; S.selectedVillageMove=null; save(); renderVillage(); toast('위치를 바꿨어요.'); return; } }
  const idx=S.placed.findIndex(p=>p.slot===slot); if(idx<0)return; if(S.selectedVillageMove===slot){ S.selectedVillageMove=null; renderVillage(); return; } S.selectedVillageMove=slot; renderVillage(); toast('이동할 다른 빈 부지를 눌러 주세요.'); }
function selectStyle(groupKey,id){ const group=STYLE_GROUPS.find(g=>g.key===groupKey), item=group.items.find(it=>it.id===id); if(!styleUnlocked(groupKey,item)){ toast('아직 잠겨 있어요. 별이나 미션으로 해금하세요!'); return; } S.avatar[groupKey]=id; save(); renderStyle(); }

function popNewCell(i){const el=document.querySelector(`[data-cell="${i}"]`);if(!el)return;el.classList.add('just-spawned');setTimeout(()=>el.classList.remove('just-spawned'),700)}
function burstAt(x,y,count=13){
 const colors=['#ffcc51','#ff84aa','#8de7e0','#ffe4a3','#d1adff'];
 for(let i=0;i<count;i++){
  const s=document.createElement('span');s.className='burst';s.textContent=i%4===0?'✦':'✧';
  const angle=(i/count)*Math.PI*2,r=35+Math.random()*50;
  s.style.left=x+'px';s.style.top=y+'px';s.style.color=colors[i%colors.length];
  s.style.setProperty('--dx',(Math.cos(angle)*r)+'px');s.style.setProperty('--dy',(Math.sin(angle)*r)+'px');
  document.body.appendChild(s);setTimeout(()=>s.remove(),900);
 }
}
function celebrateCell(i){const el=document.querySelector(`[data-cell="${i}"]`);if(!el)return;el.classList.add('merged-flash');const r=el.getBoundingClientRect();burstAt(r.x+r.width/2,r.y+r.height/2,14);setTimeout(()=>el.classList.remove('merged-flash'),850)}
function celebrateOrder(){const el=$('orderRail'); if(!el)return;const r=el.getBoundingClientRect();burstAt(r.x+r.width/2,r.y+r.height/2,22)}

function startDrag(e, idx){ const item=S.board[idx]; if(!item)return; drag={from:idx}; const ghost=document.createElement('div'); ghost.className='dragGhost'; ghost.innerHTML=`<div class="piece ${getChain(item.chain).klass}" style="width:64px;height:64px"><span class="badge">${item.lvl+1}</span><span class="art">${itemArt(item.chain,item.lvl)}</span></div>`; document.body.appendChild(ghost); drag.ghost=ghost; moveGhost(e); const cell=document.querySelector(`[data-cell="${idx}"]`); if(cell)cell.classList.add('dragging'); }
function pt(e){ if(e.touches&&e.touches[0])return {x:e.touches[0].clientX,y:e.touches[0].clientY}; if(e.changedTouches&&e.changedTouches[0])return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}; return {x:e.clientX,y:e.clientY}; }
function moveGhost(e){ if(!drag)return; const p=pt(e); drag.ghost.style.left=p.x+'px'; drag.ghost.style.top=p.y+'px'; document.querySelectorAll('.cell.target').forEach(el=>el.classList.remove('target')); const target=document.elementFromPoint(p.x,p.y)?.closest('.cell'); if(target)target.classList.add('target'); }
function endDrag(e){ if(!drag)return; const p=pt(e); const target=document.elementFromPoint(p.x,p.y)?.closest('.cell'); document.querySelectorAll('.cell.target,.cell.dragging').forEach(el=>el.classList.remove('target','dragging')); drag.ghost.remove(); if(target){ const to=Number(target.dataset.cell); if(to===drag.from)selectCell(drag.from); else moveItem(drag.from,to); } else {selectCell(drag.from);} suppressBoardClick=true;setTimeout(()=>suppressBoardClick=false,30); drag=null; }

function bind(){ $('bottomNav').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b)setTab(b.dataset.tab); }); $('orderRail').addEventListener('click',e=>{ const b=e.target.closest('[data-order]'); if(b)completeOrder(Number(b.dataset.order)); }); $('board').addEventListener('click',e=>{ const gen=e.target.closest('[data-source]'); if(gen){spawnFromGenerator(gen.dataset.source);return;} const b=e.target.closest('[data-cell]'); if(b&&!suppressBoardClick)selectCell(Number(b.dataset.cell)); }); $('board').addEventListener('pointerdown',e=>{ const b=e.target.closest('[data-cell]'); if(!b)return; const idx=Number(b.dataset.cell); if(!S.board[idx])return; e.preventDefault(); startDrag(e,idx); }); window.addEventListener('pointermove',e=>{ if(drag){ e.preventDefault(); moveGhost(e); } }, {passive:false}); window.addEventListener('pointerup',e=>{ if(drag){ e.preventDefault(); endDrag(e); } }, {passive:false}); window.addEventListener('pointercancel',e=>{ if(drag)endDrag(e); }, {passive:false}); $('genRow').addEventListener('click',e=>{ const b=e.target.closest('[data-gen]'); if(b)spawnFromGenerator(b.dataset.gen); }); $('storyBtn').onclick=openStoryModal; $('helpBtn').onclick=openHelp; $('eventBtn').onclick=openEventModal; $('soundBtn').onclick=()=>{ S.sound=!S.sound; $('soundBtn').textContent=S.sound?'🔊':'🔇'; save(); };
  $('modalBg').addEventListener('click',e=>{ if(e.target===e.currentTarget)closeModal(); });
  $('content').addEventListener('click',e=>{ const p=e.target.closest('[data-buy]'); if(p)buyPlace(p.dataset.buy); const q=e.target.closest('[data-plot]'); if(q)placeAt(Number(q.dataset.plot)); const s=e.target.closest('[data-style]'); if(s)selectStyle(s.dataset.stylegroup,s.dataset.style); const c=e.target.closest('[data-chaininfo]'); if(c)openChainModal(c.dataset.chaininfo); const mt=e.target.closest('[data-mtab]'); if(mt){ missionView=mt.dataset.mtab; renderMissions(); } const cl=e.target.closest('[data-claim]'); if(cl)claimMission(cl.dataset.claim); });
}
function ticker(){ setInterval(()=>{ syncTime(); renderTop(); if(S.tab==='missions')renderMissions(); if(S.tab==='village')renderVillage(); },1000); }
load(); bind(); render(); ticker(); window.addEventListener('resize',fitBoard); setTimeout(fitBoard,60);
</script>
