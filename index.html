function save(){

    if(!saved)throw new Error('storage denied');

function load(){
  let restored=false;
  try{
    for(const key of [SAVE_KEY,'santa_merge_story_v6','santa_merge_story_v5','santa_merge_story_v4']){
      const raw=localStorage.getItem(key);if(!raw)continue;
      const old=JSON.parse(raw);
      if(old&&Array.isArray(old.board)){
        S={...defaultState(),...old,version:7,board:[...old.board,...Array(Math.max(0,GRID-old.board.length)).fill(null)].slice(0,GRID),
          genPositions:old.genPositions&&typeof old.genPositions==='object'?old.genPositions:{...DEFAULT_GEN_POS},
          pendingPlace:null,selectedVillageMove:null};
        restored=true;break;
      }
    }
  }catch(e){}
  normalizeState();
  if(!restored){seedBoard();fillOrders()}
  else if(!S.orders.length)fillOrders();
  // Protect items on producer locations during old save migration.
  for(const loc of Object.values(S.genPositions)){
    if(!S.board[loc])continue;
    const vacant=S.board.findIndex((v,i)=>!v&&!isGeneratorCell(i));
    if(vacant>=0){S.board[vacant]=S.board[loc];S.board[loc]=null}
  }
  syncTime();save();
}

function normalizeState(){
  if(!Array.isArray(S.board)||S.board.length!==GRID)S.board=[...(S.board||[]),...Array(GRID).fill(null)].slice(0,GRID);
  if(!S.discovered)S.discovered=defaultState().discovered;
  for(const k of Object.keys(CHAINS))if(!Array.isArray(S.discovered[k]))S.discovered[k]=Array(CHAINS[k].levels.length).fill(false);
  if(!Array.isArray(S.orders))S.orders=[];
  if(!Array.isArray(S.placed))S.placed=[];
  if(!Array.isArray(S.missionClaimed))S.missionClaimed=[];
  if(!S.avatar)S.avatar=defaultState().avatar;
  if(!S.stats)S.stats={highFeast:0};
  if(!S.storySeen)S.storySeen=['ep1'];
  const valid=(x)=>Number.isInteger(x)&&x>=0&&x<GRID;
  if(!S.genPositions || Object.keys(DEFAULT_GEN_POS).some(k=>!valid(S.genPositions[k])) || new Set(Object.values(S.genPositions)).size!==GENERATORS.length) S.genPositions={...DEFAULT_GEN_POS};
  S.placed=S.placed.filter(p=>p&&VILLAGE_SHOP.some(v=>v.id===p.shopId)).map((p,i)=>({shopId:p.shopId,x:Number.isFinite(+p.x)?Math.max(5,Math.min(95,+p.x)):(VILLAGE_ANCHORS[p.slot??i%15]||VILLAGE_ANCHORS[i%15])[0],y:Number.isFinite(+p.y)?Math.max(8,Math.min(92,+p.y)):(VILLAGE_ANCHORS[p.slot??i%15]||VILLAGE_ANCHORS[i%15])[1]}));
  S.energy=Math.max(0,Math.min(MAX_ENERGY,Number(S.energy)||0));
  S.coins=Math.max(0,Number(S.coins)||0); S.rubies=Math.max(0,Number(S.rubies)||0); S.stars=Math.max(0,Number(S.stars)||0);
  if(!Number.isFinite(S.nextEnergyAt))S.nextEnergyAt=Date.now()+ENERGY_MS;
  if(!Number.isFinite(S.lastPassiveAt))S.lastPassiveAt=Date.now();
  S.selected=Number.isInteger(S.selected)?S.selected:-1;
  syncDaily();
}

function seedBoard(){ const starters=[['gift',0],['gift',0],['feast',0],['feast',0],['studio',0],['closet',0],['gift',1],['gift',1],['feast',1],['gift',2],['feast',1],['feast',0],['jewel',0],['closet',1],['gift',0],['feast',2],['studio',1],['gift',1],['jewel',1]]; S.board=Array(GRID).fill(null); starters.forEach((it,i)=>{S.board[i]={chain:it[0],lvl:it[1]}; markDiscovered(it[0],it[1]);}); }
function fmt(n){return Math.floor(n).toLocaleString('ko-KR')} function timerString(ms){const sec=Math.max(0,Math.ceil(ms/1000)); const m=Math.floor(sec/60), s=sec%60; return `${m}:${String(s).padStart(2,'0')}`}
function beep(freq=660,dur=.12,type='sine',vol=.06){ if(!S.sound)return; try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);}catch(e){} }
function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800); }
function dateKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function syncDaily(){
 const today=dateKey();if(S.dailyDate===today)return;
 S.dailyDate=today;S.dailyBase={merges:S.merges||0,deliveries:S.deliveries||0,generated:S.generated||0};
 if(Array.isArray(S.missionClaimed))S.missionClaimed=S.missionClaimed.filter(id=>!id.startsWith('daily_'));
}
function syncTime(){ syncDaily(); const now=Date.now(); let dirty=false; if(S.energy<MAX_ENERGY && now>=S.nextEnergyAt){ const gain=1+Math.floor((now-S.nextEnergyAt)/ENERGY_MS); S.energy=Math.min(MAX_ENERGY,S.energy+gain); S.nextEnergyAt+=gain*ENERGY_MS; if(S.energy>=MAX_ENERGY)S.nextEnergyAt=now+ENERGY_MS; dirty=true; } else if(S.energy>=MAX_ENERGY){ S.nextEnergyAt=now+ENERGY_MS; }
  const rate=incomePerMinute(); if(rate>0 && now-S.lastPassiveAt>=PASSIVE_MS){ const step=Math.floor((now-S.lastPassiveAt)/PASSIVE_MS); S.coins+=rate*step; S.lastPassiveAt+=step*PASSIVE_MS; dirty=true; } if(dirty)save(); }
function spendEnergy(cost=1){ syncTime(); if(S.energy<cost){ toast('⚡ 번개가 부족해요. 시간이 지나면 자동 충전됩니다.'); beep(180,.12,'square'); return false } if(S.energy===MAX_ENERGY)S.nextEnergyAt=Date.now()+ENERGY_MS; S.energy-=cost; save(); return true; }
function reward(obj={}){ if(obj.coin)S.coins+=obj.coin; if(obj.ruby)S.rubies+=obj.ruby; if(obj.star)S.stars+=obj.star; if(obj.energy)S.energy=Math.min(MAX_ENERGY,S.energy+obj.energy); if(obj.xp)S.xp+=obj.xp; }
function levelOf(){return 1+Math.floor(S.xp/80)} function incomePerMinute(){ return S.placed.reduce((s,p)=>s+((VILLAGE_SHOP.find(v=>v.id===p.shopId)||{}).income||0),0)}
function markDiscovered(chain,lvl){ if(!S.discovered[chain][lvl])S.discovered[chain][lvl]=true; }

function unlockedChains(){ return GENERATORS.filter(g=>S.stars>=g.unlockStars).map(g=>g.chain); }
function fillOrders(){ while(S.orders.length<3)S.orders.push(createOrder()); }
function createOrder(){ const chains=unlockedChains(); const diff=Math.min(4,Math.floor(S.deliveries/4)); const needCount=S.deliveries>=5 && Math.random()>.55?2:1; const needs=[]; for(let k=0;k<needCount;k++){ const chain=chains[(S.orderSeed+k)%chains.length]; const maxLvl=Math.min(2+diff, CHAINS[chain].levels.length-2); const lvl=Math.max(1,Math.floor(Math.random()*(maxLvl+1))); needs.push({chain,lvl}); }
  const client=CUSTOMERS[S.orderSeed%CUSTOMERS.length]; S.orderSeed++; const coin=needs.reduce((s,n)=>s+24+n.lvl*18,0)+(needCount>1?28:0); const star=needs.reduce((s,n)=>s+1+Math.floor(n.lvl/2),0); const xp=needs.reduce((s,n)=>s+10+n.lvl*3,0); const ruby=(Math.random()<.18?1:0); return {id:'o'+Date.now()+Math.random(), client:client.id, needs, reward:{coin,star,xp,ruby}}; }
function orderReady(order){ return findInventoryMatches(order).every(i=>i>=0); }
function findInventoryMatches(order){ const used=new Set(); return order.needs.map(n=>{ const idx=S.board.findIndex((item,i)=>!used.has(i)&&item&&item.chain===n.chain&&item.lvl===n.lvl); if(idx>=0)used.add(idx); return idx; }); }
function completeOrder(i){ const order=S.orders[i], matches=findInventoryMatches(order); if(matches.some(v=>v<0)){ toast('아직 필요한 아이템이 부족해요.'); return; } matches.forEach(idx=>S.board[idx]=null); reward(order.reward); S.deliveries++; S.orders.splice(i,1); fillOrders(); beep(520,.1,'triangle'); setTimeout(()=>beep(720,.1,'triangle'),90); setTimeout(()=>beep(920,.12,'triangle'),180); toast(`주문 완료! +🪙${order.reward.coin} +⭐${order.reward.star}${order.reward.ruby?` +💎${order.reward.ruby}`:''}`); save(); render(); celebrateOrder(); }
function spawnFromGenerator(id){
  const gen=GENERATORS.find(g=>g.id===id);if(!gen)return;
  if(S.stars<gen.unlockStars){toast(`⭐ ${gen.unlockStars}개 이상 모으면 열려요.`);return}
  const empty=emptyCells();if(!empty.length){toast('보드가 가득 찼어요. 머지하거나 판매해 보세요.');return}
  if(!spendEnergy(gen.cost))return;
  const lvl=gen.outputs[Math.floor(Math.random()*gen.outputs.length)],origin=S.genPositions[id];
  const ox=origin%GRID_W,oy=Math.floor(origin/GRID_W);
  empty.sort((a,b)=>{const ax=a%GRID_W,ay=Math.floor(a/GRID_W),bx=b%GRID_W,by=Math.floor(b/GRID_W);return Math.abs(ax-ox)+Math.abs(ay-oy)-(Math.abs(bx-ox)+Math.abs(by-oy))});
  const idx=empty[0];S.board[idx]={chain:gen.chain,lvl};S.selected=idx;S.generated++;markDiscovered(gen.chain,lvl);
  beep(680,.08,'triangle',.045);save();render();
}

function canMerge(a,b){ return a&&b&&a.chain===b.chain&&a.lvl===b.lvl&&a.lvl<CHAINS[a.chain].levels.length-1; }
function moveItem(from,to,skipFlight=false){
  const a=S.board[from],b=S.board[to];
  if(!Number.isInteger(to)||to<0||to>=GRID||isGeneratorCell(to)||!a||from===to)return;
  const fuse=canMerge(a,b);
  const apply=()=>{
    const a=S.board[from], b=S.board[to];if(!a||isGeneratorCell(to))return;
    if(!b){S.board[to]=a;S.board[from]=null;S.selected=to}
    else if(canMerge(a,b)){
      S.board[from]=null;S.board[to]={chain:b.chain,lvl:b.lvl+1};S.merges++;S.xp+=10+b.lvl*2;
      markDiscovered(b.chain,b.lvl+1);
      if(b.chain==='feast'&&b.lvl+1>=5)S.stats.highFeast=(S.stats.highFeast||0)+1;
      if(b.lvl+1===CHAINS[b.chain].levels.length-1)reward({coin:40,ruby:1});
      S.selected=to;beep(670,.12,'sine',.05);
    }else{S.board[to]=a;S.board[from]=b;S.selected=to;beep(420,.07,'sine',.035)}
    save();render();
    if(fuse){const el=document.querySelector(`[data-cell="${to}"]`);if(el){el.classList.add('soft-fuse');setTimeout(()=>el.classList.remove('soft-fuse'),280)}}
  };
  if(fuse&&!skipFlight){
    const fromEl=document.querySelector(`[data-cell="${from}"]`),toEl=document.querySelector(`[data-cell="${to}"]`);
    if(fromEl&&toEl){
      const origin=fromEl.getBoundingClientRect(),dest=toEl.getBoundingClientRect();
      const clone=fromEl.querySelector('.piece')?.cloneNode(true);
      if(clone){clone.classList.add('merge-fly');clone.style.position='fixed';clone.style.left=origin.left+'px';clone.style.top=origin.top+'px';clone.style.width=origin.width+'px';clone.style.height=origin.height+'px';document.body.appendChild(clone);
        fromEl.style.visibility='hidden';
        const anim=clone.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dest.left-origin.left}px,${dest.top-origin.top}px)`,opacity:.85}],{duration:175,easing:'ease-in-out',fill:'forwards'});
        const finish=()=>{clone.remove();fromEl.style.visibility='';apply()};anim.onfinish=finish;anim.oncancel=finish;return;
      }
    }
  }
  apply();
}

function selectCell(i){ const item=S.board[i]; if(!item){ if(S.selected>=0)moveItem(S.selected,i); return; } if(S.selected<0){ S.selected=i; render(); return; } if(S.selected===i){ S.selected=-1; render(); return; } moveItem(S.selected,i); }

function fitBoard(){
 const panel=document.querySelector('.board-panel'),board=$('board');if(!panel||!board)return;
 // Use all available width/height, with square cells like the reference game's grid.
 const bounds=panel.getBoundingClientRect();
 const w=Math.max(140,bounds.width-10),h=Math.max(180,bounds.height-10),gap=3;
 const side=Math.max(12,Math.min((w-gap*6)/7,(h-gap*8)/9));
 board.style.width=Math.round(side*7+gap*6)+'px';
 board.style.height=Math.round(side*9+gap*8)+'px';
}

function burstAt(x,y,count=13){
 const colors=['#ffcc51','#ff84aa','#8de7e0','#ffe4a3','#d1adff'];
 for(let i=0;i<count;i++){
  const s=document.createElement('span');s.className='burst';s.textContent=i%4===0?'✦':'✧';
  const angle=(i/count)*Math.PI*2,r=35+Math.random()*50;
  s.style.left=x+'px';s.style.top=y+'px';s.style.color=colors[i%colors.length];
  s.style.setProperty('--dx',(Math.cos(angle)*r)+'px');s.style.setProperty('--dy',(Math.sin(angle)*r)+'px');
  document.body.appendChild(s);setTimeout(()=>s.remove(),900);
 }
}

function moveGenerator(id,to){
  if(!GENERATOR_IDS.has(id)||!Number.isInteger(to)||to<0||to>=GRID)return false;
  const from=S.genPositions[id];if(from===to)return false;
  const other=generatorAt(to);
  if(other){S.genPositions[other]=from;S.genPositions[id]=to}
  else{S.board[from]=S.board[to];S.board[to]=null;S.genPositions[id]=to}
  S.selected=-1;save();render();toast('작업대 위치를 옮겼어요.');return true;
}

function importSave(file){

      if(!src||!Array.isArray(src.board)||!src.orders||typeof src.coins!=='number')throw Error('올바른 저장 파일이 아닙니다');

function startDrag(e,idx){
  const id=generatorAt(idx),item=S.board[idx];if(!id&&!item)return;
  const p=pt(e);drag={from:idx,genId:id,startX:p.x,startY:p.y,moved:false,ghost:null};
  try{e.target.closest('[data-cell]')?.setPointerCapture(e.pointerId)}catch(err){}
}

function pt(e){ if(e.touches&&e.touches[0])return {x:e.touches[0].clientX,y:e.touches[0].clientY}; if(e.changedTouches&&e.changedTouches[0])return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}; return {x:e.clientX,y:e.clientY}; }
function moveGhost(e){
  if(!drag)return;const p=pt(e);
  if(!drag.moved&&Math.hypot(p.x-drag.startX,p.y-drag.startY)<7)return;
  if(!drag.moved){
    drag.moved=true;const id=drag.genId,item=S.board[drag.from];
    const ghost=document.createElement('div');ghost.className='dragGhost';
    ghost.innerHTML=id?`<div class="producer ${getChain(GENERATORS.find(g=>g.id===id).chain).klass}" style="width:66px;height:66px">${generatorArt(GENERATORS.find(g=>g.id===id).chain)}</div>`:`<div class="piece ${getChain(item.chain).klass}" style="width:60px;height:60px"><span class="art">${itemArt(item.chain,item.lvl)}</span></div>`;
    document.body.appendChild(ghost);drag.ghost=ghost;
    const el=document.querySelector(`[data-cell="${drag.from}"]`);el?.classList.add('dragging');
  }
  if(drag.ghost){drag.ghost.style.left=p.x+'px';drag.ghost.style.top=p.y+'px'}
  document.querySelectorAll('.cell.target').forEach(el=>el.classList.remove('target'));
  const target=document.elementFromPoint(p.x,p.y)?.closest('.cell');if(target)target.classList.add('target');
}

function endDrag(e){
  if(!drag)return;const current=drag;drag=null;
  const p=pt(e),target=document.elementFromPoint(p.x,p.y)?.closest('.cell');
  document.querySelectorAll('.cell.target,.cell.dragging').forEach(el=>el.classList.remove('target','dragging'));
  if(current.genId){
    current.ghost?.remove();
    if(current.moved&&target)moveGenerator(current.genId,Number(target.dataset.cell));
    else if(!current.moved)spawnFromGenerator(current.genId);
  }else if(current.moved&&target){
    const to=Number(target.dataset.cell),fuse=canMerge(S.board[current.from],S.board[to]);
    if(fuse&&current.ghost){
      const ghost=current.ghost,r=target.getBoundingClientRect();
      const anim=ghost.animate([{left:p.x+'px',top:p.y+'px',opacity:1},{left:(r.left+r.width/2)+'px',top:(r.top+r.height/2)+'px',opacity:.85}],{duration:140,easing:'ease-in-out',fill:'forwards'});
      const finish=()=>{ghost.remove();moveItem(current.from,to,true)};anim.onfinish=finish;anim.oncancel=finish;
    }else{current.ghost?.remove();moveItem(current.from,to)}
  }else{current.ghost?.remove();if(!current.moved)selectCell(current.from)}
  suppressBoardClick=true;setTimeout(()=>suppressBoardClick=false,40);
}

function bind(){ $('bottomNav').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b)setTab(b.dataset.tab); }); $('orderRail').addEventListener('click',e=>{ const b=e.target.closest('[data-order]'); if(b)completeOrder(Number(b.dataset.order)); }); $('board').addEventListener('click',e=>{ const info=e.target.closest('[data-source-info]');if(info){showGeneratorInfo(info.dataset.sourceInfo);return;}const gen=e.target.closest('[data-source]');if(gen){if(!suppressBoardClick)spawnFromGenerator(gen.dataset.source);return;}const b=e.target.closest('[data-cell]');if(b&&!suppressBoardClick)selectCell(Number(b.dataset.cell)); }); $('board').addEventListener('pointerdown',e=>{if(e.target.closest('[data-source-info]'))return;const b=e.target.closest('[data-cell]');if(!b)return;const idx=Number(b.dataset.cell);if(!S.board[idx]&&!generatorAt(idx))return;e.preventDefault();startDrag(e,idx); }); window.addEventListener('pointermove',e=>{ if(drag){ e.preventDefault(); moveGhost(e); } }, {passive:false}); window.addEventListener('pointerup',e=>{ if(drag){ e.preventDefault(); endDrag(e); } }, {passive:false}); window.addEventListener('pointercancel',e=>{if(drag){drag.ghost?.remove();drag=null;document.querySelectorAll('.cell.target,.cell.dragging').forEach(el=>el.classList.remove('target','dragging'));}}, {passive:false}); $('genRow').addEventListener('click',e=>{ const b=e.target.closest('[data-gen]'); if(b)spawnFromGenerator(b.dataset.gen); }); $('storyBtn').onclick=openStoryModal; $('helpBtn').onclick=openHelp; $('eventBtn').onclick=openEventModal; $('soundBtn').onclick=()=>{ S.sound=!S.sound; $('soundBtn').textContent=S.sound?'🔊':'🔇'; save(); };
  $('modalBg').addEventListener('click',e=>{ if(e.target===e.currentTarget)closeModal(); });
  $('content').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-building]');if(!b||S.tab!=='village')return;e.preventDefault();townDrag={index:Number(b.dataset.building),button:b,startX:e.clientX,startY:e.clientY,moved:false};try{b.setPointerCapture(e.pointerId)}catch(err){}});
  $('content').addEventListener('pointermove',townPointerMove,{passive:false});
  $('content').addEventListener('pointerup',townPointerEnd);
  $('content').addEventListener('pointercancel',()=>{townDrag=null;});
  $('content').addEventListener('click',e=>{if(S.tab==='village'&&S.pendingPlace&&!e.target.closest('[data-buy]')&&!e.target.closest('[data-building]')){const world=e.target.closest('#townWorld');if(world){const r=world.getBoundingClientRect();placeAtPoint((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100);return}} const p=e.target.closest('[data-buy]'); if(p)buyPlace(p.dataset.buy); const q=e.target.closest('[data-plot]'); if(q)placeAt(Number(q.dataset.plot)); const s=e.target.closest('[data-style]'); if(s)selectStyle(s.dataset.stylegroup,s.dataset.style); const c=e.target.closest('[data-chaininfo]'); if(c)openChainModal(c.dataset.chaininfo); const mt=e.target.closest('[data-mtab]'); if(mt){ missionView=mt.dataset.mtab; renderMissions(); } const cl=e.target.closest('[data-claim]'); if(cl)claimMission(cl.dataset.claim); });
}
function ticker(){ setInterval(()=>{ syncTime(); renderTop(); if(S.tab==='missions')renderMissions(); },1000); }
load(); bind(); render(); ticker();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});window.addEventListener('pagehide',save);setInterval(save,20000);window.addEventListener('resize',()=>requestAnimationFrame(fitBoard));setTimeout(fitBoard,60);setTimeout(fitBoard,250);
</script>
