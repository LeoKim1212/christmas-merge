
<!DOCTYPE html>
<html lang="ko">

<title>산타의 머지 스토리</title>
<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{overflow:hidden}

.topbar:before,.topbar:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}.topbar:before{width:190px;height:190px;left:-70px;top:-130px}.topbar:after{width:170px;height:170px;right:-45px;top:-90px}
.headline{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{display:flex;gap:10px;align-items:center;min-width:0}.logo-badge{width:52px;height:52px;border-radius:18px;background:linear-gradient(180deg,#fff7d9,#fff0b2);display:grid;place-items:center;box-shadow:0 4px 0 rgba(134,65,82,.28);font-size:29px;position:relative}.logo-badge .lv{position:absolute;left:-2px;bottom:-4px;background:#7f57d0;border:2px solid #fff;border-radius:999px;padding:1px 7px;color:#fff;font-size:11px;font-weight:900}.logo-copy{min-width:0}.logo-copy strong{display:block;font-size:18px;letter-spacing:-.5px}.logo-copy small{display:block;opacity:.92;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.mini-actions{display:flex;gap:8px}.round{width:38px;height:38px;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;font-size:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

.content{flex:1;min-height:0;position:relative}

.board{height:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(8,1fr);gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}.cell{border-radius:13px;background:rgba(255,255,255,.34);border:1px solid rgba(218,196,164,.95);position:relative;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 2px rgba(255,255,255,.6);touch-action:none}.cell.empty{background:rgba(255,255,255,.14)}.cell.selected{outline:3px solid #57b7ff}.cell.target{outline:3px dashed #ef9458}.cell.need{box-shadow:inset 0 0 0 2px #9ad5a4}.cell.dragging .piece{opacity:.25}.piece{width:90%;height:90%;border-radius:17px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 4px 10px rgba(153,118,103,.16), inset 0 1px rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.78);background:#fff}.piece .badge{position:absolute;left:4px;top:4px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:rgba(255,255,255,.86);display:grid;place-items:center;font-size:10px;color:#7d6467;font-weight:900;z-index:1}.piece .art{width:76%;height:76%}.gGift{background:linear-gradient(180deg,#fff0b7,#ffd777)}.gFeast{background:linear-gradient(180deg,#ffe4d8,#ffc5b7)}.gStudio{background:linear-gradient(180deg,#dff2ff,#a7dcff)}.gJewel{background:linear-gradient(180deg,#eee1ff,#c8b6ff)}.gCloset{background:linear-gradient(180deg,#ffe1ef,#ffbad6)}

.panel{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:12px;margin-bottom:12px}.panel h3{margin:0 0 10px;font-size:16px}.panel-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.sub{font-size:11px;color:var(--muted)}
.village-hero{background:linear-gradient(180deg,#a6dafd,#e2f5ff 37%,#f9feff 38%,#eef4f8 100%);border-radius:24px;border:1px solid #ddeef8;padding:12px;box-shadow:var(--shadow)}.sky-status{display:flex;justify-content:space-between;align-items:flex-start}.sky-status .cloud{font-size:18px;opacity:.84}.sky-status .badge{font-size:12px;font-weight:900;color:#5d7fa4;background:rgba(255,255,255,.86);padding:8px 10px;border-radius:14px;box-shadow:0 4px 10px rgba(119,168,189,.18)}.plots{margin-top:12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.plot{aspect-ratio:1;border-radius:18px;background:linear-gradient(180deg,#ffffff,#eef6f7);border:1px solid #d6ebf4;position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}.plot.empty{background:linear-gradient(180deg,#ffffffaa,#eef6f766);border-style:dashed}.plot.sel{outline:3px dashed #ef8b67}.plot .label{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.92);font-size:9px;font-weight:900;color:#638090;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vShop{display:flex;gap:8px;overflow:auto;padding-top:10px;scrollbar-width:none}.vShop::-webkit-scrollbar{display:none}.buy-card{min-width:126px;background:#fff;border:1px solid #e6ded4;border-radius:18px;padding:10px;box-shadow:var(--shadow)}.buy-card .t{display:flex;gap:8px;align-items:center}.buy-card .bico{width:38px;height:38px;border-radius:14px;background:#fff6ee;display:grid;place-items:center}.buy-card strong{display:block;font-size:12px}.buy-card small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.buy-card .buy{margin-top:8px;width:100%;padding:8px;border-radius:12px;background:linear-gradient(180deg,#56c48c,#349f74);color:#fff;font-weight:900;font-size:10px}.buy-card .buy.locked{background:#ece7e0;color:#907f77}
.style-stage{background:linear-gradient(180deg,#ffdbe3,#fff1f4 40%,#fff9fb);border:1px solid #f0d8de;border-radius:24px;padding:14px;box-shadow:var(--shadow)}.doll-stage{position:relative;height:280px;border-radius:20px;background:linear-gradient(180deg,#fff3f6,#fffafc 62%,#fdebe7);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}.doll-stage:before{content:'';position:absolute;left:50%;top:22px;transform:translateX(-50%);width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#fff,#ffe7f0 65%,transparent 66%);opacity:.9}.avatarBox{width:180px;height:250px;position:relative;z-index:2}.styleGroup+.styleGroup{margin-top:12px}.styleGroup h4{margin:0 0 8px;font-size:13px}.styleGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.styleOpt{background:#fff;border:1px solid #ebdce1;border-radius:16px;padding:8px;text-align:center}.styleOpt.locked{opacity:.56}.styleOpt.active{outline:3px solid #68bbff}.styleOpt .pv{aspect-ratio:1;border-radius:14px;background:linear-gradient(180deg,#fff7fb,#fff);display:grid;place-items:center}.styleOpt strong{display:block;font-size:10px;margin-top:6px}.styleOpt small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.bookGroup+.bookGroup{margin-top:14px}.bookRow{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding-bottom:2px}.bookRow::-webkit-scrollbar{display:none}.bookItem{min-width:74px;background:#fff;border:1px solid #ebdfd6;border-radius:18px;padding:8px;text-align:center}.bookItem .ic{width:50px;height:50px;border-radius:16px;margin:0 auto 6px;display:grid;place-items:center;background:#fff}.bookItem .q{background:#f3f0ed;color:#b7a8a4}.bookItem strong{display:block;font-size:10px}.bookItem small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.missionTabs{display:flex;gap:8px;margin-bottom:10px}.missionTabs button{padding:8px 12px;border-radius:999px;background:#fff0ec;color:#a0757f;font-size:11px;font-weight:900}.missionTabs button.active{background:linear-gradient(180deg,#ef7d88,#dc6478);color:#fff}.mList{display:grid;gap:9px}.mission{background:linear-gradient(180deg,#fffdf8,#fff5ec);border:1px solid #efdfd3;border-radius:18px;padding:11px}.mission .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.mission .hd strong{font-size:13px}.mission .hd span{font-size:10px;color:#b7837f}.mission p{margin:5px 0 8px;font-size:11px;color:var(--muted);line-height:1.45}.bar{height:10px;border-radius:999px;background:#efe5dd;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#77cc9c,#51ba84)}.mission .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}.reward{font-size:10px;font-weight:900;padding:6px 8px;border-radius:999px;background:#fff0e4;color:#af7a59}.claim{padding:8px 10px;border-radius:12px;background:#e6ddd6;color:#8e7f76;font-size:11px;font-weight:900}.claim.ready{background:linear-gradient(180deg,#58c58e,#35a074);color:#fff}

<body>
<div id="app">
  <div class="topbar">
    <div class="headline">
      <div class="logo">
        <div class="logo-badge">🎄<span class="lv" id="levelBadge">1</span></div>
        <div class="logo-copy">
          <strong>산타의 머지 스토리</strong>
          <small id="storySummary">눈꽃 마을을 복구하고 손님들의 부탁을 도와주세요.</small>
        </div>
      </div>
      <div class="mini-actions">
        <button class="round" id="soundBtn">🔊</button>
        <button class="round" id="helpBtn">❔</button>
      </div>
    </div>
    <div class="currency-row">
      <div class="currency energy"><div class="chip">⚡</div><div class="tx"><strong id="energyText">0 / 40</strong><small id="energyTimer">충전중</small></div></div>
      <div class="currency coin"><div class="chip">🪙</div><div class="tx"><strong id="coinText">0</strong><small>건물 · 장식 구매</small></div></div>
      <div class="currency ruby"><div class="chip">💎</div><div class="tx"><strong id="rubyText">0</strong><small>특별 이벤트 보상</small></div></div>
      <div class="currency star"><div class="chip">⭐</div><div class="tx"><strong id="starText">0</strong><small id="deliveryText">납품 0회</small></div></div>
    </div>
  </div>

  <div class="main">
    <div class="content">
      <section class="page merge active" id="page-merge">
        <div class="story-strip">
          <div class="story-portrait" id="storyPortrait"></div>
          <div class="story-copy">
            <strong id="mergeStoryTitle">에피소드 1 · 사라진 축제 준비물</strong>
            <small id="mergeStoryCopy">손님 주문을 완료하고 별을 모아 눈꽃 마을 축제를 다시 준비하세요.</small>
          </div>
          <button class="story-link" id="storyBtn">스토리</button>
        </div>

        <div class="order-rail" id="orderRail"></div>

        <div class="merge-shell">
          <div class="board-shell">
            <div class="board-top"><strong>머지 보드</strong><small id="boardMeta">0 / 56 칸</small></div>
            <div class="board-panel"><div class="board" id="board"></div></div>
          </div>
          <div class="info-dock" id="infoDock"></div>
          <div class="gen-dock">
            <div class="gen-dock-head"><strong>작업대 / 생성기</strong><small>한 화면에서 바로 생성 · 머지</small></div>
            <div class="gen-row" id="genRow"></div>
          </div>
        </div>
      </section>

      <section class="page scroll" id="page-village"></section>
      <section class="page scroll" id="page-style"></section>
      <section class="page scroll" id="page-book"></section>
      <section class="page scroll" id="page-missions"></section>
    </div>

    <nav class="nav" id="bottomNav"></nav>
  </div>
</div>

<div class="toast" id="toast"></div>

function fmt(n){return Math.floor(n).toLocaleString('ko-KR')} function timerString(ms){const sec=Math.max(0,Math.ceil(ms/1000)); const m=Math.floor(sec/60), s=sec%60; return `${m}:${String(s).padStart(2,'0')}`}

function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800); }
function syncTime(){ const now=Date.now(); let dirty=false; if(S.energy<MAX_ENERGY && now>=S.nextEnergyAt){ const gain=1+Math.floor((now-S.nextEnergyAt)/ENERGY_MS); S.energy=Math.min(MAX_ENERGY,S.energy+gain); S.nextEnergyAt=now+ENERGY_MS; dirty=true; } else if(S.energy>=MAX_ENERGY){ S.nextEnergyAt=now+ENERGY_MS; }
  const rate=incomePerMinute(); if(rate>0 && now-S.lastPassiveAt>=PASSIVE_MS){ const step=Math.floor((now-S.lastPassiveAt)/PASSIVE_MS); S.coins+=rate*step; S.lastPassiveAt+=step*PASSIVE_MS; dirty=true; } if(dirty)save(); }

function reward(obj={}){ if(obj.coin)S.coins+=obj.coin; if(obj.ruby)S.rubies+=obj.ruby; if(obj.star)S.stars+=obj.star; if(obj.energy)S.energy=Math.min(MAX_ENERGY,S.energy+obj.energy); if(obj.xp)S.xp+=obj.xp; }

function markDiscovered(chain,lvl){ if(!S.discovered[chain][lvl])S.discovered[chain][lvl]=true; }

function itemName(item){ return getLevel(item.chain,item.lvl).name; }
function emptyCells(){ return S.board.map((v,i)=>v?null:i).filter(v=>v!==null); }
function unlockedChains(){ return GENERATORS.filter(g=>S.stars>=g.unlockStars).map(g=>g.chain); }
function fillOrders(){ while(S.orders.length<3)S.orders.push(createOrder()); }
function createOrder(){ const chains=unlockedChains(); const diff=Math.min(4,Math.floor(S.deliveries/4)); const needCount=S.deliveries>=5 && Math.random()>.55?2:1; const needs=[]; for(let k=0;k<needCount;k++){ const chain=chains[(S.orderSeed+k)%chains.length]; const maxLvl=Math.min(2+diff, CHAINS[chain].levels.length-2); const lvl=Math.max(1,Math.floor(Math.random()*(maxLvl+1))); needs.push({chain,lvl}); }
  const client=CUSTOMERS[S.orderSeed%CUSTOMERS.length]; S.orderSeed++; const coin=needs.reduce((s,n)=>s+24+n.lvl*18,0)+(needCount>1?28:0); const star=needs.reduce((s,n)=>s+1+Math.floor(n.lvl/2),0); const xp=needs.reduce((s,n)=>s+10+n.lvl*3,0); const ruby=(Math.random()<.18?1:0); return {id:'o'+Date.now()+Math.random(), client:client.id, needs, reward:{coin,star,xp,ruby}}; }
function orderReady(order){ return findInventoryMatches(order).every(i=>i>=0); }
function findInventoryMatches(order){ const used=new Set(); return order.needs.map(n=>{ const idx=S.board.findIndex((item,i)=>!used.has(i)&&item&&item.chain===n.chain&&item.lvl===n.lvl); if(idx>=0)used.add(idx); return idx; }); }
function completeOrder(i){ const order=S.orders[i], matches=findInventoryMatches(order); if(matches.some(v=>v<0)){ toast('아직 필요한 아이템이 부족해요.'); return; } matches.forEach(idx=>S.board[idx]=null); reward(order.reward); S.deliveries++; S.orders.splice(i,1); fillOrders(); beep(520,.1,'triangle'); setTimeout(()=>beep(720,.1,'triangle'),90); setTimeout(()=>beep(920,.12,'triangle'),180); toast(`주문 완료! +🪙${order.reward.coin} +⭐${order.reward.star}${order.reward.ruby?` +💎${order.reward.ruby}`:''}`); save(); render(); }
function spawnFromGenerator(id){ const gen=GENERATORS.find(g=>g.id===id); if(!gen)return; if(S.stars<gen.unlockStars){ toast(`⭐ ${gen.unlockStars}개 이상 모으면 열려요.`); return; } if(!spendEnergy(gen.cost))return; const empty=emptyCells(); if(!empty.length){ toast('보드가 가득 찼어요. 머지하거나 판매해 보세요.'); return; } const lvl=gen.outputs[Math.floor(Math.random()*gen.outputs.length)], idx=empty[Math.floor(Math.random()*empty.length)]; S.board[idx]={chain:gen.chain,lvl}; S.selected=idx; S.generated++; markDiscovered(gen.chain,lvl); beep(700,.1,'triangle'); save(); render(); }

function renderTop(){ syncTime(); $('soundBtn').textContent=S.sound?'🔊':'🔇'; $('energyText').textContent=`${S.energy} / ${MAX_ENERGY}`; $('energyTimer').textContent=S.energy>=MAX_ENERGY?'충전 완료':`+1 ${timerString(S.nextEnergyAt-Date.now())}`; $('coinText').textContent=fmt(S.coins); $('rubyText').textContent=fmt(S.rubies); $('starText').textContent=fmt(S.stars); $('deliveryText').textContent=`납품 ${S.deliveries}회`; $('levelBadge').textContent=levelOf(); const story=[...STORIES].reverse().find(storyUnlocked)||STORIES[0]; $('storySummary').textContent=story.title; $('mergeStoryTitle').textContent=story.title; $('mergeStoryCopy').textContent=story.lines[0][1]; $('storyPortrait').innerHTML=portraitArt(CUSTOMERS[0]); }
function renderNav(){ $('bottomNav').innerHTML=TABS.map(t=>`<button class="${S.tab===t.id?'active':''}" data-tab="${t.id}"><span class="ico">${t.icon}</span><span>${t.label}</span></button>`).join(''); }
function renderPages(){ document.querySelectorAll('.page').forEach(p=>{ p.classList.toggle('active', p.id===`page-${S.tab}`); }); }
function renderOrders(){ $('orderRail').innerHTML=S.orders.map((o,i)=>{ const c=customer(o.client), ready=orderReady(o); const wants=o.needs.map(n=>`<div class="want ${ready?'ok':''}"><div class="piece ${getChain(n.chain).klass}"><span class="art">${itemArt(n.chain,n.lvl)}</span></div><span class="n">${n.lvl+1}</span></div>`).join(''); return `<div class="order-card ${ready?'ready':''}"><div class="person-row"><div class="portrait">${portraitArt(c)}</div><div class="pmeta"><strong>${esc(c.name)}</strong><small>${esc(c.role)}</small></div></div><div class="want-list">${wants}</div><div class="order-reward">🪙${o.reward.coin} · ⭐${o.reward.star}${o.reward.ruby?` · 💎${o.reward.ruby}`:''}</div><button class="go" data-order="${i}" ${ready?'':'disabled'}>${ready?'주문 완료하기':'아이템 준비 중'}</button></div>`; }).join(''); }
function renderBoard(){ const need=demandKeys(); let used=0; $('board').innerHTML=S.board.map((item,i)=>{ const classes=['cell']; if(!item)classes.push('empty'); if(S.selected===i)classes.push('selected'); if(item&&need[item.chain+':'+item.lvl])classes.push('need'); const inner=item?`<div class="piece ${getChain(item.chain).klass}"><span class="badge">${item.lvl+1}</span><span class="art">${itemArt(item.chain,item.lvl)}</span></div>`:''; if(item)used++; return `<button class="${classes.join(' ')}" data-cell="${i}">${inner}</button>`; }).join(''); $('boardMeta').textContent=`${used} / ${GRID} 칸`; renderInfo(); }
function renderInfo(){ const item=S.board[S.selected]; if(!item){ $('infoDock').innerHTML=`<div class="info-icon">👆</div><div class="info-copy"><strong>아이템을 선택해 보세요</strong><small>같은 아이템끼리 머지하면 한 단계 올라가고, 손님 주문에 필요한 아이템은 초록빛으로 표시돼요.</small></div><div class="info-actions"><button class="mini" id="tipsBtn">설명</button></div>`; $('tipsBtn').onclick=openHelp; return; } const lv=getLevel(item.chain,item.lvl); $('infoDock').innerHTML=`<div class="info-icon"><div class="piece ${getChain(item.chain).klass}" style="width:40px;height:40px;border-radius:14px"><span class="art">${itemArt(item.chain,item.lvl)}</span></div></div><div class="info-copy"><strong>${lv.name} · ${item.lvl+1}단계</strong><small>${lv.desc} · ${getChain(item.chain).name}</small></div><div class="info-actions"><button class="mini" id="sellBtn">판매</button><button class="mini" id="bookBtn">느낌표</button></div>`; $('sellBtn').onclick=sellSelected; $('bookBtn').onclick=()=>openChainModal(item.chain); }
function renderGenerators(){ $('genRow').innerHTML=GENERATORS.map(g=>{ const locked=S.stars<g.unlockStars; return `<button class="gen ${locked?'locked':''}" data-gen="${g.id}"><div class="gtop"><div class="gico">${generatorIcon(g.chain)}</div><div><strong>${g.name}</strong><small>${getChain(g.chain).name}</small></div></div><div class="gfoot"><span class="tag">${locked?`⭐ ${g.unlockStars}`:'생성 가능'}</span><span>⚡ ${g.cost}</span></div></button>`; }).join(''); }
function renderVillage(){ const page=$('page-village'); page.innerHTML=`<div class="panel"><div class="panel-top"><h3>눈꽃 마을</h3><div class="sub">별로 해금 · 코인으로 구매 · 탭해서 이동</div></div><div class="village-hero"><div class="sky-status"><div class="cloud">☁️ ❄️ ☁️</div><div class="badge">수입 +${incomePerMinute()} / 1분 · 배치 ${S.placed.length}개</div></div><div class="plots" id="plotGrid"></div></div><div class="vShop" id="vShop"></div></div>`;
  const slots=Array.from({length:15},(_,i)=>i); $('plotGrid').innerHTML=slots.map(slot=>{ const placed=S.placed.find(p=>p.slot===slot); if(!placed){ return `<button class="plot empty ${S.pendingPlace||S.selectedVillageMove!==null?'sel':''}" data-plot="${slot}">${S.pendingPlace?'＋':'·'}</button>`; } const def=VILLAGE_SHOP.find(v=>v.id===placed.shopId)||VILLAGE_SHOP[0]; return `<button class="plot ${S.selectedVillageMove===slot?'sel':''}" data-plot="${slot}">${villageArt(def.id)}<span class="label">${def.name}</span></button>`; }).join('');
  $('vShop').innerHTML=VILLAGE_SHOP.map(shop=>{ const locked=S.stars<shop.unlockStars; const owned=S.placed.filter(p=>p.shopId===shop.id).length; return `<div class="buy-card"><div class="t"><div class="bico">${villageArt(shop.id)}</div><div><strong>${shop.name}</strong><small>${shop.desc}</small></div></div><button class="buy ${locked?'locked':''}" data-buy="${shop.id}">${locked?`⭐ ${shop.unlockStars} 필요`:owned?`배치 ${owned}개 · 구매`: `구매 🪙${shop.price}`}</button></div>`; }).join(''); }
function renderStyle(){ const page=$('page-style'); page.innerHTML=`<div class="panel style-stage"><div class="panel-top"><h3>주인공 꾸미기</h3><div class="sub">별과 미션 보상으로 해금</div></div><div class="doll-stage"><div class="avatarBox">${protagonistArt()}</div></div><div id="styleWrap"></div></div>`; $('styleWrap').innerHTML=STYLE_GROUPS.map(group=>`<div class="styleGroup"><h4>${group.title}</h4><div class="styleGrid">${group.items.map(it=>{ const unlocked=styleUnlocked(group.key,it), active=S.avatar[group.key]===it.id; const label=group.key==='hair'?'💇🏻':group.key==='outfit'?'👗':'✨'; return `<button class="styleOpt ${unlocked?'':'locked'} ${active?'active':''}" data-stylegroup="${group.key}" data-style="${it.id}"><div class="pv">${label}</div><strong>${it.name}</strong><small>${unlocked?'사용 가능':it.unlockMission?'미션 보상':`⭐ ${it.unlockStars}`}</small></button>`; }).join('')}</div></div>`).join(''); }
function renderBook(){ const page=$('page-book'); page.innerHTML=`<div class="panel"><div class="panel-top"><h3>머지 도감</h3><div class="sub">미발견 항목은 ? 로 표시</div></div><div id="bookWrap"></div></div>`; $('bookWrap').innerHTML=Object.values(CHAINS).map(chain=>`<div class="bookGroup"><div class="panel-top"><h3 style="font-size:14px;margin:0">${chain.name}</h3><button class="mini" data-chaininfo="${chain.id}">느낌표</button></div><div class="bookRow">${chain.levels.map((lv,i)=>{ const known=S.discovered[chain.id][i]; return `<div class="bookItem"><div class="ic ${known?'':'q'}">${known?itemArt(chain.id,i):'?'}</div><strong>${known?lv.name:'미발견'}</strong><small>${known?`${i+1}단계`:'?'}</small></div>`; }).join('')}</div></div>`).join(''); }
function renderMissions(){ const page=$('page-missions'); page.innerHTML=`<div class="panel"><div class="panel-top"><h3>이벤트 · 미션 · 업적</h3><div class="sub">완료 후 보상 수령</div></div><div class="missionTabs" id="missionTabs"></div><div class="mList" id="missionList"></div></div>`; $('missionTabs').innerHTML=[['daily','일일 미션'],['event','이벤트'],['achievement','업적']].map(([id,label])=>`<button class="${missionView===id?'active':''}" data-mtab="${id}">${label}</button>`).join(''); $('missionList').innerHTML=MISSIONS[missionView].map(m=>{ const prog=missionProgress(m), pct=Math.min(100,prog.value/prog.target*100), claimed=isMissionClaimed(m.id); const rewardTxt=[m.reward.coin?`🪙${m.reward.coin}`:'',m.reward.star?`⭐${m.reward.star}`:'',m.reward.ruby?`💎${m.reward.ruby}`:'',m.reward.energy?`⚡${m.reward.energy}`:'',m.reward.styleUnlock?'👗 스타일':''].filter(Boolean).join(' · '); return `<div class="mission"><div class="hd"><strong>${m.title}</strong><span>${Math.min(prog.value,m.target)} / ${m.target}</span></div><p>${m.desc}</p><div class="bar"><span style="width:${pct}%"></span></div><div class="ft"><div class="reward">보상 ${rewardTxt}</div><button class="claim ${!claimed&&prog.value>=m.target?'ready':''}" data-claim="${m.id}" ${claimed?'disabled':''}>${claimed?'수령 완료':prog.value>=m.target?'보상 받기':'진행 중'}</button></div></div>`; }).join(''); }
function renderSidePages(){ renderVillage(); renderStyle(); renderBook(); renderMissions(); }
function renderAll(){ renderTop(); renderNav(); renderOrders(); renderBoard(); renderGenerators(); renderPages(); if(S.tab!=='merge')renderSidePages(); }
function render(){ fillOrders(); renderAll(); }

function openModal(title, body, alt=false){ $('modalBox').innerHTML=`<div class="mhead ${alt?'alt':''}"><strong>${title}</strong><button class="close" id="closeModal">✕</button></div><div class="mbody">${body}</div>`; $('modalBg').classList.add('show'); document.body.style.overflow='hidden'; $('closeModal').onclick=closeModal; }
function closeModal(){ $('modalBg').classList.remove('show'); document.body.style.overflow=''; }
function openChainModal(chainId){ const chain=getChain(chainId); openModal(chain.name, `<div class="bubble"><strong>${chain.name} 족보</strong><p>같은 아이템 2개를 머지하면 다음 단계로 올라갑니다. 미발견 단계는 ? 로 가려집니다.</p></div><div style="height:12px"></div><div class="chainGrid">${chain.levels.map((lv,i)=>{ const known=S.discovered[chain.id][i]; return `<div class="chainCell"><div class="x">${known?itemArt(chain.id,i):'?'}</div><strong>${known?lv.name:'미발견'}</strong><small>${i+1}단계</small></div>`; }).join('')}</div>`); }
function openStoryModal(){ const unlocked=STORIES.filter(storyUnlocked); const latest=unlocked[unlocked.length-1]||STORIES[0]; openModal(latest.title, `<div class="dialogue">${latest.lines.map(([who,line])=>`<div class="bubble"><strong>${who}</strong><p>${line}</p></div>`).join('')}</div>`, true); }
function openHelp(){ openModal('플레이 방법', `<div class="dialogue"><div class="bubble"><strong>1. 생성기 사용</strong><p>선물상자, 다과 바구니, 포토 스튜디오 등 여러 생성기를 눌러 라인별 아이템을 만드세요.</p></div><div class="bubble"><strong>2. 머지하기</strong><p>같은 아이템을 드래그하거나, 먼저 선택한 뒤 다른 칸을 눌러 합칠 수 있어요.</p></div><div class="bubble"><strong>3. 손님 주문 납품</strong><p>손님 카드를 보면 필요한 아이템이 표시됩니다. 완료하면 코인, 별, 경험치를 얻어요.</p></div><div class="bubble"><strong>4. 마을/주인공 꾸미기</strong><p>별과 미션 보상으로 새로운 생성기, 건물, 의상, 소품이 열립니다.</p></div></div>`); }

function buyPlace(id){ const shop=VILLAGE_SHOP.find(v=>v.id===id); if(S.stars<shop.unlockStars){ toast(`⭐ ${shop.unlockStars}개 이상 모으면 열려요.`); return; } if(S.coins<shop.price){ toast('코인이 부족해요.'); return; } S.pendingPlace=id; S.selectedVillageMove=null; renderVillage(); toast(`${shop.name}을(를) 둘 빈 부지를 눌러 주세요.`); }
function placeAt(slot){ if(S.pendingPlace){ if(S.placed.some(p=>p.slot===slot)){ toast('이미 배치된 자리예요.'); return; } const shop=VILLAGE_SHOP.find(v=>v.id===S.pendingPlace); S.coins-=shop.price; S.placed.push({shopId:shop.id,slot}); S.pendingPlace=null; save(); renderVillage(); renderTop(); toast(shop.name+' 배치 완료!'); return; }
  if(S.selectedVillageMove!==null && !S.placed.some(p=>p.slot===slot)){ const idx=S.placed.findIndex(p=>p.slot===S.selectedVillageMove); if(idx>=0){ S.placed[idx].slot=slot; S.selectedVillageMove=null; save(); renderVillage(); toast('위치를 바꿨어요.'); return; } }
  const idx=S.placed.findIndex(p=>p.slot===slot); if(idx<0)return; if(S.selectedVillageMove===slot){ S.selectedVillageMove=null; renderVillage(); return; } S.selectedVillageMove=slot; renderVillage(); toast('이동할 다른 빈 부지를 눌러 주세요.'); }
function selectStyle(groupKey,id){ const group=STYLE_GROUPS.find(g=>g.key===groupKey), item=group.items.find(it=>it.id===id); if(!styleUnlocked(groupKey,item)){ toast('아직 잠겨 있어요. 별이나 미션으로 해금하세요!'); return; } S.avatar[groupKey]=id; save(); renderStyle(); }

function startDrag(e, idx){ const item=S.board[idx]; if(!item)return; drag={from:idx}; const ghost=document.createElement('div'); ghost.className='dragGhost'; ghost.innerHTML=`<div class="piece ${getChain(item.chain).klass}" style="width:64px;height:64px"><span class="badge">${item.lvl+1}</span><span class="art">${itemArt(item.chain,item.lvl)}</span></div>`; document.body.appendChild(ghost); drag.ghost=ghost; moveGhost(e); const cell=document.querySelector(`[data-cell="${idx}"]`); if(cell)cell.classList.add('dragging'); }
function pt(e){ if(e.touches&&e.touches[0])return {x:e.touches[0].clientX,y:e.touches[0].clientY}; if(e.changedTouches&&e.changedTouches[0])return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}; return {x:e.clientX,y:e.clientY}; }
function moveGhost(e){ if(!drag)return; const p=pt(e); drag.ghost.style.left=p.x+'px'; drag.ghost.style.top=p.y+'px'; document.querySelectorAll('.cell.target').forEach(el=>el.classList.remove('target')); const target=document.elementFromPoint(p.x,p.y)?.closest('.cell'); if(target)target.classList.add('target'); }
function endDrag(e){ if(!drag)return; const p=pt(e); const target=document.elementFromPoint(p.x,p.y)?.closest('.cell'); document.querySelectorAll('.cell.target,.cell.dragging').forEach(el=>el.classList.remove('target','dragging')); drag.ghost.remove(); if(target){ const to=Number(target.dataset.cell); S.selected=drag.from; moveItem(drag.from,to); } drag=null; }

function bind(){ $('bottomNav').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b)setTab(b.dataset.tab); }); $('orderRail').addEventListener('click',e=>{ const b=e.target.closest('[data-order]'); if(b)completeOrder(Number(b.dataset.order)); }); $('board').addEventListener('click',e=>{ const b=e.target.closest('[data-cell]'); if(b)selectCell(Number(b.dataset.cell)); }); $('board').addEventListener('pointerdown',e=>{ const b=e.target.closest('[data-cell]'); if(!b)return; const idx=Number(b.dataset.cell); if(!S.board[idx])return; e.preventDefault(); startDrag(e,idx); }); window.addEventListener('pointermove',e=>{ if(drag){ e.preventDefault(); moveGhost(e); } }, {passive:false}); window.addEventListener('pointerup',e=>{ if(drag){ e.preventDefault(); endDrag(e); } }, {passive:false}); window.addEventListener('pointercancel',e=>{ if(drag)endDrag(e); }, {passive:false}); $('genRow').addEventListener('click',e=>{ const b=e.target.closest('[data-gen]'); if(b)spawnFromGenerator(b.dataset.gen); }); $('storyBtn').onclick=openStoryModal; $('helpBtn').onclick=openHelp; $('soundBtn').onclick=()=>{ S.sound=!S.sound; $('soundBtn').textContent=S.sound?'🔊':'🔇'; save(); };
  $('modalBg').addEventListener('click',e=>{ if(e.target===e.currentTarget)closeModal(); });
  $('content').addEventListener('click',e=>{ const p=e.target.closest('[data-buy]'); if(p)buyPlace(p.dataset.buy); const q=e.target.closest('[data-plot]'); if(q)placeAt(Number(q.dataset.plot)); const s=e.target.closest('[data-style]'); if(s)selectStyle(s.dataset.stylegroup,s.dataset.style); const c=e.target.closest('[data-chaininfo]'); if(c)openChainModal(c.dataset.chaininfo); const mt=e.target.closest('[data-mtab]'); if(mt){ missionView=mt.dataset.mtab; renderMissions(); } const cl=e.target.closest('[data-claim]'); if(cl)claimMission(cl.dataset.claim); });
}
function ticker(){ setInterval(()=>{ syncTime(); renderTop(); if(S.tab==='missions')renderMissions(); if(S.tab==='village')renderVillage(); },1000); }
load(); bind(); render(); ticker();
</script>
</body>
</html>
